# ============================================================
# Mosquitto MQTT Broker Configuration
# Base config with username/password authentication
# ============================================================

# --- Listener settings ---
# Standard MQTT listener (TCP)
listener 1883
protocol mqtt

# Optional WebSocket listener
# listener 9001
# protocol websockets

# --- Authentication settings ---
allow_anonymous false
password_file /mosquitto/config/passwd

# --- Persistence settings ---
persistence true
persistence_location /mosquitto/data/

# --- Logging ---
log_dest file /mosquitto/log/mosquitto.log
log_timestamp true
connection_messages true
log_type error
log_type warning
log_type notice
log_type information

# --- Message and performance tuning ---
max_inflight_messages 20
message_size_limit 0

# --- Security (optional tuning) ---
# Set to true to require TLS (if certificates are configured)
# require_certificate false
# cafile /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key