#most-shelly-client/docker-compose.yml
version: '3.8'

networks:
  most_net:
    external: true

  wg_net:
    ipam:
      config:
      - subnet: 192.168.125.0/24

services:
  wireguard:
    image: procustodibus/wireguard
    cap_add:
    - NET_ADMIN
    networks:
      wg_net:
        ipv4_address: 192.168.125.123
    ports:
    #50002:51820
    - 50002:50002/udp
    restart: always
    volumes:
    - /etc/localtime:/etc/localtime:ro
    - /opt/most-shelly/wireguard:/etc/wireguard

  whoami-srv:
    image: jwilder/whoami
    networks:
      wg_net:
        ipv4_address: 192.168.125.3
    restart: unless-stopped
    volumes:
    - /etc/localtime:/etc/localtime:ro

